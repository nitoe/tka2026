<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mengerjakan Kuis – Portal Latihan TKA 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a56db; --primary-dark: #12296b; --primary-mid: #1e429f; --primary-light: #ebf5ff;
    --green: #057a55; --green-light: #def7ec;
    --red: #dc2626; --red-light: #fee2e2;
    --amber: #d97706; --amber-light: #fef3c7;
    --slate: #64748b; --slate-light: #f1f5f9;
    --text: #1f2a37; --text-muted: #6b7280;
    --bg: #f0f4ff; --white: #fff; --border: #d1d5db;
    --radius: 14px; --shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: clamp(14px, 3.5vw, 16px); }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 90px; }

  .header {
    position: sticky; top: 0; z-index: 100;
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: white; padding: 0 16px; height: 56px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    box-shadow: 0 2px 10px rgba(26,86,219,0.4);
  }
  .header-brand { display: flex; flex-direction: column; min-width: 0; }
  .brand-name { font-family: 'Baloo 2', cursive; font-size: clamp(0.8rem, 3vw, 1rem); font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub-brand { font-size: 0.66rem; opacity: 0.8; font-weight: 600; }
  .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .progress-pill, .timer-pill {
    background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px; padding: 5px 12px; font-size: 0.74rem; font-weight: 800; white-space: nowrap;
  }
  .timer-pill.warn { background: rgba(217,119,6,0.35); border-color: rgba(217,119,6,0.6); }
  .timer-pill.danger { background: rgba(220,38,38,0.4); border-color: rgba(220,38,38,0.7); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }

  .container { max-width: 720px; margin: 0 auto; padding: 20px 16px 20px; }

  .soal-card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 18px 20px; margin-bottom: 16px; }
  .soal-nomor { display: inline-block; background: var(--primary-light); color: var(--primary-dark); font-weight: 800; font-size: 0.74rem; padding: 3px 10px; border-radius: 8px; margin-bottom: 10px; }
  .soal-stimulus { font-size: 0.86rem; line-height: 1.6; margin-bottom: 12px; padding: 12px; background: #f8fafc; border-radius: 10px; border: 1px solid var(--border); }
  .soal-stimulus img { max-width: 100%; border-radius: 8px; margin-top: 6px; }
  .soal-pertanyaan { font-weight: 800; font-size: 0.95rem; margin-bottom: 14px; line-height: 1.5; }

  .opsi-row {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
    border: 1.5px solid var(--border); border-radius: 10px; margin-bottom: 8px; cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .opsi-row:hover { border-color: var(--primary); background: var(--primary-light); }
  .opsi-row input { margin-top: 3px; flex-shrink: 0; width: 17px; height: 17px; }
  .opsi-text { font-size: 0.86rem; font-weight: 700; }

  table.cat-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 4px; }
  table.cat-table th, table.cat-table td { border: 1px solid var(--border); padding: 8px; text-align: center; }
  table.cat-table th { background: var(--slate-light); font-weight: 800; font-size: 0.74rem; }
  table.cat-table td:first-child { text-align: left; font-weight: 700; }

  .skor-tag { float: right; font-size: 0.68rem; font-weight: 700; color: var(--text-muted); }

  .footer-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--white);
    border-top: 1px solid var(--border); padding: 12px 16px; box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
    display: flex; justify-content: center; z-index: 90;
  }
  .btn-submit {
    max-width: 720px; width: 100%; border: none; border-radius: 10px; padding: 14px;
    background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: white;
    font-family: 'Nunito', sans-serif; font-size: 0.92rem; font-weight: 800; cursor: pointer;
  }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

  /* ── HASIL ── */
  .hasil-card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 22px; text-align: center; }
  .hasil-emoji { font-size: 3rem; margin-bottom: 8px; }
  .hasil-skor { font-family: 'Baloo 2', cursive; font-size: 2.4rem; color: var(--primary-dark); font-weight: 800; }
  .hasil-label { color: var(--text-muted); font-weight: 700; font-size: 0.85rem; margin-bottom: 20px; }
  .hasil-ditahan { font-size: 1rem; font-weight: 700; color: var(--primary-dark); line-height: 1.6; margin: 16px 0 8px; }
  .hasil-ditahan-sub { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
  .breakdown-title { font-weight: 800; font-size: 0.85rem; margin: 18px 0 10px; text-align: left; color: var(--primary-dark); }
  .breakdown-row { display: flex; justify-content: space-between; font-size: 0.82rem; padding: 8px 0; border-bottom: 1px solid var(--border); text-align: left; }
  .btn-kembali { display: inline-block; margin-top: 20px; background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: white; text-decoration: none; padding: 12px 28px; border-radius: 10px; font-weight: 800; font-size: 0.88rem; }

  .loading-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-weight: 700; font-size: 0.9rem; text-align: center; padding: 20px; flex-direction: column; gap: 10px; }
</style>
</head>
<body>

<div id="loading" class="loading-screen">Menyiapkan soal...</div>

<div id="page" style="display:none;">
  <header class="header">
    <div class="header-brand">
      <div class="brand-name" id="paket-nama">—</div>
      <div class="sub-brand">TKA 2026 · SD Muhammadiyah 01 Kukusan</div>
    </div>
    <div class="header-right">
      <div class="timer-pill" id="timer-pill" style="display:none;">⏱ --:--</div>
      <div class="progress-pill" id="progress-pill">0/0 dijawab</div>
    </div>
  </header>

  <main class="container" id="soal-container"></main>

  <div class="footer-bar">
    <button class="btn-submit" id="btn-submit">✅ Kumpulkan Jawaban</button>
  </div>
</div>

<div id="hasil-page" style="display:none;">
  <header class="header">
    <div class="header-brand">
      <div class="brand-name">Hasil Pengerjaan</div>
      <div class="sub-brand">TKA 2026 · SD Muhammadiyah 01 Kukusan</div>
    </div>
  </header>
  <main class="container">
    <div class="hasil-card">
      <div class="hasil-emoji" id="hasil-emoji">🎉</div>
      <div class="hasil-skor" id="hasil-skor">0 / 0</div>
      <div class="hasil-label" id="hasil-label">Skor Kamu</div>
      <div id="breakdown-area"></div>
      <div id="hasil-ditahan-area" style="display:none;">
        <div class="hasil-ditahan">✅ Jawaban berhasil dikumpulkan.</div>
        <div class="hasil-ditahan-sub">Hasil try out akan diumumkan oleh guru. Terima kasih sudah mengerjakan dengan sungguh-sungguh!</div>
      </div>
      <a href="./index.html" class="btn-kembali">Kembali ke Beranda</a>
    </div>
  </main>
</div>

<div id="error-box" class="loading-screen" style="display:none;"></div>

<script type="module">
  import { isConfigured, auth, db, onAuthStateChanged, getStudentDoc, signOut } from '../assets/firebase-init.js';
  import { hashJawabanSiswa } from '../assets/scoring.js';
  import { doc, getDoc, collection, addDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const loading = document.getElementById('loading');
  const page = document.getElementById('page');
  const hasilPage = document.getElementById('hasil-page');
  const errorBox = document.getElementById('error-box');

  function showError(msg) {
    loading.style.display = 'none';
    errorBox.style.display = 'flex';
    errorBox.innerHTML = `<div>⚠️ ${msg}</div><a href="./index.html" style="color:#1a56db; font-weight:800;">← Kembali ke Beranda</a>`;
  }

  if (!isConfigured) {
    showError('Firebase belum dikonfigurasi.');
  } else {
    const params = new URLSearchParams(window.location.search);
    const paketId = params.get('paketId');
    if (!paketId) {
      window.location.href = './index.html';
    } else {
      onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = '../index.html'; return; }
        const siswa = await getStudentDoc(user.uid);
        if (!siswa) { await signOut(auth); window.location.href = '../index.html'; return; }

        try {
          const paketSnap = await getDoc(doc(db, 'packages', paketId));
          if (!paketSnap.exists()) { showError('Paket tidak ditemukan.'); return; }
          const paket = { id: paketSnap.id, ...paketSnap.data() };
          const questionIds = paket.questionIds || [];
          if (questionIds.length === 0) { showError('Paket ini belum punya soal.'); return; }

          // ── Cek batas percobaan (khusus try out / paket yang punya maksPercobaan) ──
          const maks = paket.maksPercobaan;
          if (maks != null && maks > 0) {
            const qAttempts = query(
              collection(db, 'attempts'),
              where('studentId', '==', user.uid),
              where('packageId', '==', paketId)
            );
            const attemptSnap = await getDocs(qAttempts);
            if (attemptSnap.size >= maks) {
              showError(`Anda sudah menyelesaikan paket ini (${attemptSnap.size}/${maks} kali). Tidak dapat mengerjakan ulang.`);
              return;
            }
          }

          const soalDocs = await Promise.all(
            questionIds.map(id => getDoc(doc(db, 'soalPublik', id)))
          );
          const soalList = soalDocs
            .filter(s => s.exists())
            .map(s => ({ id: s.id, ...s.data() }));

          if (soalList.length === 0) { showError('Soal untuk paket ini tidak ditemukan (mungkin belum di-backfill ke Soal Publik).'); return; }

          renderKuis(paket, soalList, user.uid, siswa);
        } catch (err) {
          showError('Gagal memuat soal: ' + err.message);
        }
      });
    }
  }

  function renderKuis(paket, soalList, uid, siswa) {
    document.getElementById('paket-nama').textContent = paket.nama + (paket.jenis === 'tryout' ? ' (TRY OUT)' : '');
    loading.style.display = 'none';
    page.style.display = 'block';

    const jawaban = {};
    const waktuMulai = Date.now();
    let submitted = false;
    let timerInterval = null;

    // ── Timer (jika ada durasiMenit) ──
    const durasiMenit = paket.durasiMenit;
    if (durasiMenit && durasiMenit > 0) {
      const timerEl = document.getElementById('timer-pill');
      timerEl.style.display = 'block';
      let sisaDetik = durasiMenit * 60;

      function updateTimer() {
        if (submitted) return;
        const m = Math.floor(sisaDetik / 60);
        const s = sisaDetik % 60;
        timerEl.textContent = `⏱ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        if (sisaDetik <= 60) {
          timerEl.classList.add('danger');
          timerEl.classList.remove('warn');
        } else if (sisaDetik <= 300) {
          timerEl.classList.add('warn');
        }
        if (sisaDetik <= 0) {
          clearInterval(timerInterval);
          // Auto-submit saat waktu habis
          doSubmit('waktu_habis');
        }
        sisaDetik--;
      }
      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
    }

    const container = document.getElementById('soal-container');
    container.innerHTML = soalList.map((s, idx) => renderSoalCard(s, idx)).join('');

    function updateProgress() {
      const total = soalList.length;
      const terjawab = Object.keys(jawaban).length;
      document.getElementById('progress-pill').textContent = `${terjawab}/${total} dijawab`;
    }

    container.querySelectorAll('.opsi-row input').forEach(input => {
      input.addEventListener('change', () => {
        const qid = input.dataset.qid;
        const tipe = input.closest('.opsi-row').dataset.tipe;
        if (tipe === 'pg') {
          jawaban[qid] = input.value;
        } else {
          const inputsForQ = container.querySelectorAll(`input[data-qid="${qid}"]`);
          const dipilih = [...inputsForQ].filter(i => i.checked).map(i => i.value);
          if (dipilih.length > 0) jawaban[qid] = dipilih; else delete jawaban[qid];
        }
        updateProgress();
      });
    });

    container.querySelectorAll('input[data-role="cat-radio"]').forEach(input => {
      input.addEventListener('change', () => {
        const qid = input.dataset.qid;
        const rowCount = parseInt(input.dataset.rowcount, 10);
        const current = jawaban[qid] || new Array(rowCount).fill(null);
        current[parseInt(input.dataset.rowindex, 10)] = input.value;
        jawaban[qid] = current;
        updateProgress();
      });
    });

    async function doSubmit(statusOverride) {
      if (submitted) return;
      submitted = true;
      if (timerInterval) clearInterval(timerInterval);

      const btn = document.getElementById('btn-submit');
      const totalSoal = soalList.length;
      const terjawab = Object.keys(jawaban).length;

      if (!statusOverride && terjawab < totalSoal) {
        const lanjut = confirm(`Baru ${terjawab} dari ${totalSoal} soal dijawab. Soal yang belum dijawab akan dianggap salah. Yakin mau mengumpulkan sekarang?`);
        if (!lanjut) {
          submitted = false;
          return;
        }
      }

      btn.disabled = true;
      btn.textContent = statusOverride === 'waktu_habis' ? 'Waktu habis — menyimpan...' : 'Menghitung nilai...';

      let skorAkhir = 0;
      let skorMaksimal = 0;
      const perTipeMateri = {};
      const perKompleksitas = {};

      for (const s of soalList) {
        const skorSoal = s.skor || 0;
        skorMaksimal += skorSoal;
        const jawabSiswa = jawaban[s.id];
        let benar = false;
        if (jawabSiswa !== undefined && jawabSiswa !== null) {
          const hashSiswa = await hashJawabanSiswa(s.tipe, jawabSiswa);
          benar = hashSiswa === s.kunciHash;
        }
        if (benar) skorAkhir += skorSoal;

        const tm = s.tipeMateri || 'Belum Dikategorikan';
        const kp = s.kompleksitas || 'Belum Dikategorikan';
        perTipeMateri[tm] = perTipeMateri[tm] || { benar: 0, total: 0 };
        perTipeMateri[tm].total++;
        if (benar) perTipeMateri[tm].benar++;

        perKompleksitas[kp] = perKompleksitas[kp] || { benar: 0, total: 0 };
        perKompleksitas[kp].total++;
        if (benar) perKompleksitas[kp].benar++;
      }

      const waktuSelesai = Date.now();
      const durasiDetik = Math.round((waktuSelesai - waktuMulai) / 1000);
      const status = statusOverride || 'selesai';

      try {
        await addDoc(collection(db, 'attempts'), {
          studentId: uid,
          namaSiswa: siswa.nama,
          kelasSiswa: siswa.kelas,
          packageId: paket.id,
          packageNama: paket.nama,
          subjectId: paket.subjectId,
          jenisPaket: paket.jenis || 'latihan',
          jawaban,
          skorAkhir,
          skorMaksimal,
          skorPerTipeMateri: perTipeMateri,
          skorPerKompleksitas: perKompleksitas,
          waktuMulai: new Date(waktuMulai),
          waktuSelesai: new Date(waktuSelesai),
          durasiDetik,
          status,
          createdAt: serverTimestamp(),
        });
      } catch (err) {
        alert('Gagal menyimpan hasil: ' + err.message + '\nCoba kumpulkan ulang.');
        submitted = false;
        btn.disabled = false;
        btn.textContent = '✅ Kumpulkan Jawaban';
        return;
      }

      tampilkanHasil(skorAkhir, skorMaksimal, perTipeMateri, perKompleksitas, paket);
    }

    document.getElementById('btn-submit').addEventListener('click', () => doSubmit(null));

    updateProgress();
  }

  function renderSoalCard(s, idx) {
    const nomor = idx + 1;
    let bodyHtml = '';

    if (s.tipe === 'pg') {
      bodyHtml = (s.opsi || []).map(opt => `
        <label class="opsi-row" data-qid="${s.id}" data-tipe="pg">
          <input type="radio" name="q-${s.id}" data-qid="${s.id}" value="${escapeAttr(opt)}">
          <span class="opsi-text">${opt}</span>
        </label>
      `).join('');
    } else if (s.tipe === 'pgk') {
      bodyHtml = (s.opsi || []).map(opt => `
        <label class="opsi-row" data-qid="${s.id}" data-tipe="pgk">
          <input type="checkbox" data-qid="${s.id}" value="${escapeAttr(opt)}">
          <span class="opsi-text">${opt}</span>
        </label>
      `).join('');
    } else if (s.tipe === 'pgk-cat') {
      const cols = s.cols || ['Benar', 'Salah'];
      const rows = s.rows || [];
      bodyHtml = `
        <table class="cat-table">
          <thead><tr><th>Pernyataan</th>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
          <tbody>
            ${rows.map((r, ri) => `
              <tr>
                <td>${r}</td>
                ${cols.map(c => `
                  <td><input type="radio" data-role="cat-radio" data-qid="${s.id}" data-rowindex="${ri}" data-rowcount="${rows.length}" name="q-${s.id}-r${ri}" value="${escapeAttr(c)}"></td>
                `).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    return `
      <div class="soal-card">
        <span class="skor-tag">Skor: ${s.skor ?? '-'}</span>
        <div class="soal-nomor">Soal ${nomor}</div>
        ${s.stimulus ? `<div class="soal-stimulus">${s.stimulus}</div>` : ''}
        <div class="soal-pertanyaan">${s.pertanyaan}</div>
        ${bodyHtml}
      </div>
    `;
  }

  function escapeAttr(str) {
    return String(str).replace(/"/g, '"');
  }

  function tampilkanHasil(skorAkhir, skorMaksimal, perTipeMateri, perKompleksitas, paket) {
    document.getElementById('page').style.display = 'none';
    document.getElementById('hasil-page').style.display = 'block';

    const tampilkan = paket.tampilkanHasil !== false; // default true untuk paket lama

    if (!tampilkan) {
      // Mode try out: hasil ditahan
      document.getElementById('hasil-emoji').textContent = '✅';
      document.getElementById('hasil-skor').style.display = 'none';
      document.getElementById('hasil-label').style.display = 'none';
      document.getElementById('breakdown-area').style.display = 'none';
      document.getElementById('hasil-ditahan-area').style.display = 'block';
    } else {
      const persen = skorMaksimal > 0 ? Math.round((skorAkhir / skorMaksimal) * 100) : 0;
      document.getElementById('hasil-emoji').textContent = persen >= 70 ? '🎉' : '💪';
      document.getElementById('hasil-skor').textContent = `${skorAkhir} / ${skorMaksimal}`;
      document.getElementById('hasil-label').textContent = `Skor Kamu (${persen}%)`;

      let html = '<div class="breakdown-title">Rincian per Tipe Materi</div>';
      for (const [k, v] of Object.entries(perTipeMateri)) {
        html += `<div class="breakdown-row"><span>${k}</span><span>${v.benar}/${v.total} benar</span></div>`;
      }
      html += '<div class="breakdown-title">Rincian per Kompleksitas</div>';
      for (const [k, v] of Object.entries(perKompleksitas)) {
        html += `<div class="breakdown-row"><span>${k}</span><span>${v.benar}/${v.total} benar</span></div>`;
      }
      document.getElementById('breakdown-area').innerHTML = html;
    }
  }
</script>

</body>
</html>
