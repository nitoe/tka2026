<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilih Paket – Portal Latihan TKA 2026</title>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<div id="loading" class="loading-screen"><div class="spinner"></div><div>Memuat paket…</div></div>

<div id="page" style="display:none;">
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">TKA</div>
      <div class="brand-text">
        <div class="brand-name">Portal Latihan TKA</div>
        <div class="brand-sub">SD Muhammadiyah 01 Kukusan</div>
      </div>
    </div>
    <div class="header-actions">
      <a href="./index.html" class="btn-ghost">← Beranda</a>
    </div>
  </header>

  <main class="container">
    <div class="page-kicker">Paket tersedia</div>
    <h1 class="page-title" id="page-title">Pilih paket</h1>
    <p class="page-desc">Pilih paket latihan atau try out yang aktif. Try out biasanya dibatasi waktu dan token.</p>
    <div id="paket-list" class="paket-list"></div>
    <div id="empty-state" class="empty-state" style="display:none;">Belum ada paket aktif untuk mata pelajaran ini.</div>
  </main>
</div>

<div id="not-configured" class="loading-screen" style="display:none;">
  <div>Firebase belum dikonfigurasi.</div>
  <a href="../index.html">← Kembali</a>
</div>

<script type="module">
  import { isConfigured, auth, db, onAuthStateChanged, getStudentDoc, signOut } from '../assets/firebase-init.js';
  import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const loading = document.getElementById('loading');
  const page = document.getElementById('page');
  const notConfigured = document.getElementById('not-configured');
  const NAMA_MAPEL = { 'matematika': 'Matematika', 'bahasa-indonesia': 'Bahasa Indonesia' };

  if (!isConfigured) {
    loading.style.display = 'none';
    notConfigured.style.display = 'flex';
  } else {
    const params = new URLSearchParams(window.location.search);
    const mapel = params.get('mapel');
    if (!mapel || !NAMA_MAPEL[mapel]) {
      location.href = './index.html';
    } else {
      onAuthStateChanged(auth, async (user) => {
        if (!user) { location.href = '../index.html'; return; }
        const siswa = await getStudentDoc(user.uid);
        if (!siswa) { await signOut(auth); location.href = '../index.html'; return; }

        document.getElementById('page-title').textContent = NAMA_MAPEL[mapel];
        loading.style.display = 'none';
        page.style.display = 'block';

        const q = query(
          collection(db, 'packages'),
          where('subjectId', '==', mapel),
          where('aktif', '==', true)
        );
        const snap = await getDocs(q);
        const pakets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const listEl = document.getElementById('paket-list');
        const emptyEl = document.getElementById('empty-state');
        if (!pakets.length) { emptyEl.style.display = 'block'; return; }

        const now = new Date();
        function parseWaktu(val) {
          if (!val) return null;
          if (typeof val.toDate === 'function') return val.toDate();
          const d = new Date(val);
          return isNaN(d.getTime()) ? null : d;
        }
        listEl.innerHTML = pakets.map(p => {
          const isTryout = p.jenis === 'tryout';
          let metaBits = [`${(p.questionIds || []).length} soal`, `Skor maks ${p.totalSkor ?? '—'}`];
          let disabled = false;
          let btnLabel = isTryout ? 'Mulai try out' : 'Mulai latihan';
          let note = '';
          if (isTryout) {
            metaBits.push(`${p.durasiMenit || 60} menit`);
            if (p.token) metaBits.push('Token');
            const buka = parseWaktu(p.bukaPada);
            const tutup = parseWaktu(p.tutupPada);
            if (buka && now < buka) {
              disabled = true; btnLabel = 'Belum dibuka';
              note = `<div style="font-size:.75rem;color:var(--warn);margin-top:.35rem;font-weight:600;">Dibuka ${buka.toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'})}</div>`;
            } else if (tutup && now > tutup) {
              disabled = true; btnLabel = 'Sudah ditutup';
              note = `<div style="font-size:.75rem;color:var(--danger);margin-top:.35rem;font-weight:600;">Ditutup ${tutup.toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'})}</div>`;
            }
          }
          const badge = isTryout
            ? '<span class="badge badge-tryout">TRY OUT</span>'
            : '<span class="badge badge-latihan">LATIHAN</span>';
          const btn = disabled
            ? `<button class="btn btn-secondary" disabled>${btnLabel}</button>`
            : `<a class="btn btn-primary" href="./kuis.html?paketId=${p.id}">${btnLabel}</a>`;
          return `<div class="paket-card">
            <div style="min-width:0;flex:1;">
              <div class="paket-nama">${p.nama || 'Paket'} ${badge}</div>
              <div class="paket-meta">${metaBits.map(m => `<span>${m}</span>`).join('<span>·</span>')}</div>
              ${note}
            </div>
            ${btn}
          </div>`;
        }).join('');
      });
    }
  }
</script>
</body>
</html>
